{{/* Reading-progress bar — injected on every page via Monochrome's extension point. */}}
<div class="reading-progress-bar" aria-hidden="true"></div>
<script>
(function () {
  var pdfLink = document.querySelector('[data-pdf-download]');
  var bar = document.querySelector('.reading-progress-bar');

  if (pdfLink) {
    var slug = pdfLink.getAttribute('data-pdf-slug');
    var href = pdfLink.getAttribute('href');
    if (!href && slug) {
      pdfLink.setAttribute('href', '/pdf/' + slug + '.pdf');
    }
  }

  if (!bar) return;

  function update() {
    var scrollTop  = window.scrollY || document.documentElement.scrollTop;
    var docHeight  = document.documentElement.scrollHeight - window.innerHeight;
    var progress   = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    bar.style.width = progress + '%';
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();
</script>
